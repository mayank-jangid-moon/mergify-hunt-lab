queue_rules:
  - name: default
    conditions:
      - base=main

pull_request_rules:
  - name: probe-comment
    conditions:
      - label=probe1
    actions:
      comment:
        message: |
          P1: {{ 7*7 }}
          P2: {{ title.__class__ }}
          P3: {{ self }}
          P4: {{ author.upper() }}
          P5: {{ body.split('probe')[0] | trim }}
  - name: probe-close
    conditions:
      - label=probe2
    actions:
      close:
        message: |
          C1: {{ 7*7 }}
          C2: {{ title.__class__ }}
